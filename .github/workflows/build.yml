  name: Build

  on:
    push:
      branches: [main]
      tags: ['v*']
    pull_request:
      branches: [main]
    workflow_dispatch:

  permissions:
    contents: write

  jobs:
    build:
      strategy:
        fail-fast: false
        matrix:
          include:
            - platform: macos-latest
              target: aarch64-apple-darwin
            - platform: macos-latest
              target: x86_64-apple-darwin
            - platform: windows-latest
              target: x86_64-pc-windows-msvc

      runs-on: ${{ matrix.platform }}

      steps:
        - name: Checkout
          uses: actions/checkout@v5

        - name: Setup Node
          uses: actions/setup-node@v5
          with:
            node-version: 22

        - name: Install Rust
          uses: dtolnay/rust-toolchain@stable
          with:
            targets: ${{ matrix.target }}

        - name: Install npm dependencies
          run: npm install

        - name: Build Tauri app
          uses: tauri-apps/tauri-action@v0
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          with:
            args: --target ${{ matrix.target }}
            tagName: ${{ github.ref_name }}
            releaseName: "cdMenu ${{ github.ref_name }}"
            releaseBody: |
              ## What's New

              - **Commit hash in Pipeline View** — each pipeline row now shows the git short hash, clickable to open the commit in Bitbucket
              - **Pipeline step trigger support** — manual/paused pipeline steps can be triggered directly
              - **Improved Pipeline View UI** — better step state visualization and styling
              - **`open_url` command** — opens links in the default browser from the app

              ## Downloads

              See the assets below to download for your platform.

              > **macOS note:** The app is not yet code-signed. After installing, run:
              > ```bash
              > xattr -cr /Applications/cdMenu.app
              > ```
            releaseDraft: false
            prerelease: false

        - name: Upload artifacts (macOS)
          if: matrix.platform == 'macos-latest'
          uses: actions/upload-artifact@v5
          with:
            name: cdMenu-${{ matrix.target }}
            path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg

        - name: Upload artifacts (Windows)
          if: matrix.platform == 'windows-latest'
          uses: actions/upload-artifact@v5
          with:
            name: cdMenu-${{ matrix.target }}
            path: src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
