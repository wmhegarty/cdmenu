  name: Build

  on:
    push:
      branches: [main]
      tags: ['v*']
    pull_request:
      branches: [main]
    workflow_dispatch:

  permissions:
    contents: write

  jobs:
    build:
      strategy:
        fail-fast: false
        matrix:
          include:
            - platform: macos-latest
              target: aarch64-apple-darwin
            - platform: macos-latest
              target: x86_64-apple-darwin
            - platform: windows-latest
              target: x86_64-pc-windows-msvc

      runs-on: ${{ matrix.platform }}

      steps:
        - name: Checkout
          uses: actions/checkout@v5

        - name: Setup Node
          uses: actions/setup-node@v5
          with:
            node-version: 22

        - name: Install Rust
          uses: dtolnay/rust-toolchain@stable
          with:
            targets: ${{ matrix.target }}

        - name: Install npm dependencies
          run: npm install

        - name: Build Tauri app
          uses: tauri-apps/tauri-action@v0
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          with:
            args: --target ${{ matrix.target }}
            tagName: ${{ github.ref_name }}
            releaseName: "cdMenu ${{ github.ref_name }}"
            releaseBody: |
              ## What's New

              - **Fix Bitbucket API deprecation (CHANGE-2770)** — migrated workspace listing from deprecated `GET /2.0/workspaces` to new `GET /2.0/user/workspaces` endpoint, fixing 410 errors during credential save
              - **Improved credential validation** — now uses `GET /2.0/user` for auth checks instead of workspace listing, avoiding deprecated cross-workspace APIs
              - **Resilient workspace type handling** — workspace `name` field is now optional, matching the new API response format

              ## Downloads

              See the assets below to download for your platform.

              > **macOS note:** The app is not yet code-signed. After installing, run:
              > ```bash
              > xattr -cr /Applications/cdMenu.app
              > ```
            releaseDraft: false
            prerelease: false

        - name: Upload artifacts (macOS)
          if: matrix.platform == 'macos-latest'
          uses: actions/upload-artifact@v5
          with:
            name: cdMenu-${{ matrix.target }}
            path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg

        - name: Upload artifacts (Windows)
          if: matrix.platform == 'windows-latest'
          uses: actions/upload-artifact@v5
          with:
            name: cdMenu-${{ matrix.target }}
            path: src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
